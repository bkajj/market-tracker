resources:
  jobs:
    market_tracker_medallion:
      name: market_tracker_medallion
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: databricks/notebooks/01_bronze
            source: GIT
          environment_key: Default
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: databricks/notebooks/02_silver
            source: GIT
          environment_key: Default
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: databricks/notebooks/03_gold
            source: GIT
          environment_key: Default
      git_source:
        git_url: https://github.com/bkajj/market-tracker
        git_provider: gitHub
        git_branch: feature/databricks
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "6"
      performance_target: PERFORMANCE_OPTIMIZED
